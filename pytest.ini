[pytest]
testpaths = backend/tests
python_files = test_*.py
addopts = -ra -m "not integration"
markers =
    integration: opt-in test that uses one or more real external integrations
    database: opt-in test that requires a dedicated PostgreSQL test database
    gemini: opt-in test that requires explicit Gemini credentials and network access
    smoke: narrowly scoped smoke test for manually verified external behavior
